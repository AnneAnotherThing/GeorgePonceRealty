# George Ponce Real Estate — Netlify deploy config
# Static bilingual site (EN at root, ES under /es/), plus one serverless
# function that emails form submissions via Resend.

[build]
  # No build step, plain static HTML/CSS/JS.
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Netlify ships no security headers by default; keep parity with _headers.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[redirects]]
  from = "/api/lead"
  to = "/.netlify/functions/lead-notify"
  status = 200
